# Hand-curated overlay merged into job_types.json by build_registry.py.
# family -> which migrate-jil-to-airflow-translation/reference/job-types/*.md file covers it.
# Source for the job-type list itself: AutoSys 12.0 doc, job_type attribute, [AS p.2549-2551].
# 12.1-only job types (e.g. Kubernetes container agent) are NOT in the 12.0 doc and are
# listed under `not_in_12_0` so the parser recognises them without claiming a 12.0 cite.

families:
  core:
    translation_ref: core-cmd-box.md
    types: [CMD, BOX, CMDMACHINE]
  file-watch:
    translation_ref: file-watch-and-trigger-fw-ft.md
    types: [FW, FT]
  file-transfer:
    translation_ref: file-transfer-ftp-scp.md
    types: [FTP, SCP]
  database:
    translation_ref: database-sql-dbproc-dbmon-dbtrig-sqlagent.md
    types: [SQL, DBPROC, DBMON, DBTRIG, SQLAGENT]
  os-monitor:
    translation_ref: os-monitors-om.md
    types: [OMCPU, OMD, OMEL, OMIP, OMP, OMS, OMTF]
  web-messaging:
    translation_ref: web-and-messaging-http-wbsvc-wsdoc-jms-jmx-snmp.md
    types: [HTTP, WBSVC, WSDOC, JMSPUB, JMSSUB, JMXMAG, JMXMAS, JMXMC, JMXMOP, JMXMREM, JMXSUB, SNMPGET, SNMPSET]
  erp:
    translation_ref: erp-sap-ps-oracle-ebs.md
    types: [SAP, SAPBDC, SAPBWIP, SAPBWPC, SAPDA, SAPEVT, SAPJC, SAPPM, PS, OASG, OASET, OACOPY]
  java:
    translation_ref: java-pojo-ejb-rmi.md
    types: [POJO, ENTYBEAN, SESSBEAN, JAVARMI]
  hadoop:
    translation_ref: hadoop-hdfs-hive-pig-oozie-sqoop.md
    types: [HDFS, HIVE, PIG, OOZIE, SQOOP]
  platform:
    translation_ref: platform-i5-zos-microfocus-proxy-wol.md
    types: [I5, ZOS, ZOSM, ZOSDST, MICROFOCUS, PROXY, WOL]
  pam-informatica:
    translation_ref: pam-and-informatica.md
    types: [PAPROC, PAREQ, INFORMATICA]

aliases:
  c: CMD
  b: BOX
  f: FW

# Long names as printed in the 12.0 doc's job_type attribute page.
