[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosys-jil"
version = "2.0.0"
description = "Shared, deterministic AutoSys (CA WA AE 12.0) JIL parsing, analysis and manifest tooling for the AutoSys -> Astronomer skills."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["autosys_jil*"]

[tool.setuptools.package-data]
autosys_jil = ["registry/*.json", "registry/*.yaml", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["autosys_jil/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
